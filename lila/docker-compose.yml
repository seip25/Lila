# ─────────────────────────────────────────────────────────────────────────────
# Lila Framework — Production-Ready Docker Compose
#
# DEVELOPMENT (default):
#   lila-docker start           → Starts MySQL and Redis (run app locally: lila-dev)
#   lila-docker start mysql     → Starts only MySQL
#   lila-docker start redis     → Starts only Redis
#
# PRODUCTION:
#   lila-docker start prod      → Starts complete production stack (MySQL + Redis + App + Nginx)
#   lila-docker stop            → Stops all containers for this project
#   lila-docker stats           → Shows real-time CPU / RAM usage per container
#
# MULTI-PROJECT VPS SUPPORT:
#   Every container, volume, and network is uniquely prefixed with ${LILA_PROJECT_NAME:-lila}
#   Define unique PORT, DB_PORT, and REDIS_PORT_HOST in each project's .env to avoid conflicts.
#
# MEMORY TUNING (Low-RAM VPS):
#   - MySQL uses custom my.cnf (Performance Schema OFF, 64MB buffer pool) → ~70MB RAM
#   - Redis maxmemory is capped to 64MB with LRU eviction
#   - All containers have strict memory limits and automated log rotation
# ─────────────────────────────────────────────────────────────────────────────

services:
  nginx:
    image: nginx:alpine
    container_name: ${LILA_PROJECT_NAME:-lila}-nginx
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - public_data:/usr/share/nginx/html/public:ro
      - uds_data:/tmp/sockets:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - lila_net
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - prod

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ${LILA_PROJECT_NAME:-lila}-app
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - public_data:/app/public
      - uds_data:/tmp/sockets
    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG:-False}
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - HOST=0.0.0.0
      - PORT=8000
      - UDS_PATH=/tmp/sockets/lila.sock
      - PYTHON_JIT=${PYTHON_JIT:-1}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/ || python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - lila_net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - prod

  redis:
    image: redis:7-alpine
    container_name: ${LILA_PROJECT_NAME:-lila}-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lila_net
    deploy:
      resources:
        limits:
          memory: 96M
        reservations:
          memory: 16M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    image: mysql:8.0
    container_name: ${LILA_PROJECT_NAME:-lila}-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-lila_db}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD:-$${DB_PASSWORD:-root}} --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s
    networks:
      - lila_net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # postgres:
  #   image: postgres:16-alpine
  #   container_name: ${LILA_PROJECT_NAME:-lila}-postgres
  #   restart: unless-stopped
