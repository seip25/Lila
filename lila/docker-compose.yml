volumes:
  mysql_data:
    name: ${LILA_PROJECT_NAME:-lila}_mysql_data
  redis_data:
    name: ${LILA_PROJECT_NAME:-lila}_redis_data
  public_data:
    name: ${LILA_PROJECT_NAME:-lila}_public_data
  uds_data:
    name: ${LILA_PROJECT_NAME:-lila}_uds_data
  # postgres_data:
  #   name: ${LILA_PROJECT_NAME:-lila}_postgres_data

networks:
  lila_net:
    name: ${LILA_PROJECT_NAME:-lila}_network
    driver: bridge
