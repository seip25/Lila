# ─────────────────────────────────────────────────────────────────────────────
# Lila Framework — High Performance Nginx Reverse Proxy
# ─────────────────────────────────────────────────────────────────────────────

limit_req_zone $binary_remote_addr zone=lila_limit:10m rate=60r/s;

upstream lila_app {
    server unix:/tmp/sockets/lila.sock max_fails=3 fail_timeout=5s;
    server app:8000 backup;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/public;
    client_max_body_size 50M;
    keepalive_timeout 65;
    sendfile on;
    aio threads;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    
    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Security: Deny hidden files (except .well-known for SSL certs)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Static assets directly served by Nginx
    location /public/ {
        alias /usr/share/nginx/html/public/;
        expires 30d;
        access_log off;
        try_files $uri $uri/ @lila;
        add_header Cache-Control "public, max-age=2592000, no-transform";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|map)$ {
        try_files $uri @lila;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }
 
    location / {
        try_files $uri @lila;
    }

    # Proxy to Lila backend (UDS with TCP fallback)
    location @lila {
        limit_req zone=lila_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://lila_app;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }
 
    # JSON Error Responses for Rate Limiting
    error_page 429 = @json_429;
    location @json_429 {
        default_type application/json;
        return 429 '{"error":"Too Many Requests","code":429,"message":"Rate limit exceeded."}';
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
}
