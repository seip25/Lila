[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lila-framework"
version = "2.0.0"
description = "High-performance full-stack Python web framework with SPA View Transitions, Zero-Infra SQLite WAL, In-Memory/Redis/File cache, AI helper and Desktop mode."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Andrés Paiva Silveira", email = "andrespaivasilveiraa@gmail.com" }
]
license = { text = "MIT" }

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "starlette>=1.0.0,<2",
    "uvicorn>=0.53.0,<1",
    "httptools>=0.6.0",
    "uvloop>=0.20.0; sys_platform != 'win32'",
    "pydantic>=2.8.0",
    "pydantic[email]",
    "python-dotenv>=1.0.0",
    "SQLAlchemy[asyncio]>=2.0.30",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
    "PyJWT>=2.9.0",
    "orjson>=3.10.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "typer>=0.12.0",
    "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
standard = ["uvicorn[standard]>=0.53.0,<1"]
redis = ["redis>=5.0.0"]
mysql = ["aiomysql>=0.2.0", "pymysql>=1.1.0", "cryptography>=42.0.0"]
postgres = ["asyncpg>=0.29.0", "psycopg>=3.2.0"]
images = ["pillow>=10.4.0"]
markdown = ["markdown>=3.6"]
metrics = ["psutil>=6.0.0"]
optimize = ["rjsmin>=1.2.0", "rcssmin>=1.1.0", "pillow>=10.4.0"]
desktop = ["pywebview>=5.2", "pyinstaller>=6.10.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]
all = [
    "redis>=5.0.0",
    "pillow>=10.4.0",
    "markdown>=3.6",
    "psutil>=6.0.0",
    "rjsmin>=1.2.0",
    "rcssmin>=1.1.0",
    "pywebview>=5.2",
]

[project.scripts]
lila = "lila.cli.main:app"
lila-init = "lila.cli.scaffold:main"
lila-dev = "lila.cli.dev:main"
lila-desktop = "lila.cli.desktop:app"
lila-auth = "lila.cli.auth:app"
lila-admin = "lila.cli.create_panel_admin:app"
lila-create-panel-admin = "lila.cli.create_panel_admin:app"
lila-create-admin = "lila.cli.create_panel_admin:app"
lila-migrate = "lila.cli.migrations:app"
lila-migrations = "lila.cli.migrations:app"
lila-model = "lila.cli.model:app"
lila-crud = "lila.cli.scaffold_crud:app"
lila-scaffold-crud = "lila.cli.scaffold_crud:app"
lila-optimize = "lila.cli.optimize:main"
lila-secret-key = "lila.cli.secret_key:app"
lila-seo = "lila.cli.seo:app"
lila-worker = "lila.cli.worker:main"
lila-deploy = "lila.cli.deploy:app"
lila-backup = "lila.cli.backup:app"

[tool.setuptools.package-data]
lila = [
    "app/**/*",
    "cli/**/*",
    "public/**/*",
    "resources/**/*",
    ".env_example",
    ".gitignore",
    "AGENTS.md",
    "main.py",
    "py.typed",
]

[tool.setuptools.exclude-package-data]
lila = [
    "**/*.pyc",
    "**/__pycache__",
    "**/__pycache__/**/*",
    "app/logs/**/*",
    "app/cache/**/*",
    "**/*.sqlite",
    "**/*.sqlite-wal",
    "**/*.sqlite-shm",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lila*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[project.urls]
Homepage = "https://seip25.github.io/Lila/"
Repository = "https://github.com/seip25/Lila"
