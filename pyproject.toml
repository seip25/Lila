[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lila-framework"
version = "1.3.6"
description = "High-performance Python web framework"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Andrés Paiva Silveira", email = "andrespaivasilveiraa@gmail.com" }
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "License :: OSI Approved :: MIT License", 
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "starlette>=1.0.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic[email]",
    "python-dotenv>=1.0.0",
    "SQLAlchemy>=2.0.0",
    "PyJWT>=2.9.0",
    "orjson>=3.10.0",
    "redis>=5.0.0",
    "aiosqlite>=0.20.0",
    "aiomysql>=0.3.0",
    "pymysql>=1.1.0",
    "cryptography>=43.0.0",
    "typer>=0.12.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6", 
]

[project.optional-dependencies]
markdown = [ "markdown>=3.9"]
images = ["pillow>=11.0.0"]
postgres = ["asyncpg>=0.29.0", "psycopg>=3.2.0"]
argon2 = ["argon2-cffi>=23.1.0"]

[project.scripts]
lila-init = "lila.cli.scaffold:main"
lila-auth = "lila.cli.auth:app"
lila-create-admin = "lila.cli.create_admin:app"
lila-create-panel-admin = "lila.cli.create_panel_admin:app"
lila-migrations = "lila.cli.migrations:app"
lila-model = "lila.cli.model:app" 
lila-scaffold-crud = "lila.cli.scaffold_crud:app"
lila-secret-key = "lila.cli.secret_key:app"
lila-seo = "lila.cli.seo:app"
lila-docker = "lila.cli.docker:app"
lila-dev = "lila.cli.dev:main"
lila-worker = "lila.cli.worker:main"

[tool.setuptools.package-data]
lila = [
    "app/**/*",
    "cli/**/*",
    "public/**/*",
    "templates/**/*",
    "resources/**/*",
    "uploads/**/*",
    "docker-compose.yml",
    "docker/**/*",
    ".env",
    ".gitignore",
    "AGENTS.md",
    "main.py"
]

[tool.setuptools.exclude-package-data]
lila = [
    "**/*.pyc",
    "**/__pycache__",
    "**/__pycache__/**/*",
    "app/logs/**/*",
    "app/cache/**/*",
    "**/*.sqlite"
]

[tool.setuptools.packages.find]
where = ["."] 
include = ["lila*"]  

[project.urls]
Homepage = "https://seip25.github.io/Lila/"  
Repository = "https://github.com/seip25/Lila" 
